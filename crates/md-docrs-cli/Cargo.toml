[package]
name = "md-docrs-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "md-docrs"
path = "src/main.rs"

[features]
default = ["hybrid-cache"]
hybrid-cache = ["md-docrs-core/hybrid-cache"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["tokio", "http1"] }
clap.workspace = true
rustdoc-types.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
ureq = { version = "2", features = ["tls", "gzip"] }
zstd.workspace = true

md-docrs-core = { path = "../md-docrs-core" }
