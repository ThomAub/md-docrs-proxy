[package]
name = "md-docrs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI that renders docs.rs rustdoc JSON as Markdown"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "md-docrs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

md-docrs-core = { path = "../md-docrs-core", version = "0.1.0" }
md-docrs-fetch-http = { path = "../md-docrs-fetch-http", version = "0.1.0" }

[package.metadata.dist]
formula = "md-docrs"
