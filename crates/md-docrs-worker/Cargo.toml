[package]
name = "md-docrs-worker"
version.workspace = true
edition.workspace = true
publish = false

[package.metadata.release]
release = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait.workspace = true
md-docrs-core = { path = "../md-docrs-core", default-features = false }
rustdoc-types.workspace = true
serde_json.workspace = true
zstd.workspace = true

worker = { workspace = true, features = ["http", "axum"] }
worker-macros = { workspace = true, features = ["http"] }
axum = { version = "0.7", default-features = false, features = ["json"] }
axum-macros = "0.4.2"
tower-service.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
serde.workspace = true
