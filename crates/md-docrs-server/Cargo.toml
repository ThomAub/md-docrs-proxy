[package]
name = "md-docrs-server"
version.workspace = true
edition.workspace = true
publish = false
description = "HTTP server that renders docs.rs rustdoc JSON as Markdown"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "md-docrs-server"
path = "src/main.rs"

[features]
default = ["hybrid-cache"]
hybrid-cache = ["md-docrs-core/hybrid-cache"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["tokio", "http1", "macros"] }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true

md-docrs-core = { path = "../md-docrs-core" }
md-docrs-fetch-http = { path = "../md-docrs-fetch-http" }

[package.metadata.dist]
dist = false
