[package]
name = "md-docrs-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib for the actual wasm artifact, rlib so `cargo test -p md-docrs-wasm`
# can exercise the exported functions on the host.
crate-type = ["cdylib", "rlib"]

[features]
# Default: both surfaces.
#   - `resolve_url` alone is the minimal parity build vs Zig (spec parse + URL).
#   - `render` pulls in serde_json + rustdoc-types for the full JSON→Markdown
#     pipeline. This roughly triples the .wasm size; toggle off for
#     size-parity size comparisons.
default = ["render"]
render = ["dep:serde_json", "dep:rustdoc-types"]

[dependencies]
# Pulls in only the pure pipeline (spec / resolve / render / cache).
md_docrs_proxy = { path = "..", default-features = false }
rustdoc-types = { version = "0.57", optional = true }
serde_json = { version = "1", optional = true }

