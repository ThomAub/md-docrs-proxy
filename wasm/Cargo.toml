[package]
name = "md-docrs-wasm-compare"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "wasm-compare"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
wasmtime = "44"
wasmer = { version = "7", optional = true }

[features]
default = []
