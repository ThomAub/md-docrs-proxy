[package]
name = "md-docrs-worker"
version.workspace = true
edition.workspace = true
publish = false

[package.metadata.release]
release = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait.workspace = true
md-docrs-core = { path = "../md-docrs-core", default-features = false }
rustdoc-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ruzstd = { version = "0.8", default-features = false, features = ["std"] }

worker = { workspace = true, features = ["http"] }
worker-macros = { workspace = true, features = ["http"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
